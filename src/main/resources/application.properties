server.error.path=/error

logging.level.org.springframework.security=DEBUG

spring.data.mongodb.uri=mongodb://luna:2350189@localhost:27017/fontanero?authSource=admin
spring.data.mongodb.host=192.168.0.xx 
spring.data.mongodb.port=27017
spring.data.mongodb.database=fontanero
spring.data.mongodb.username=luna
spring.data.mongodb.password=2350189
spring.data.mongodb.authentication-database=admin 

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
